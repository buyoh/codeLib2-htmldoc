name: test-run

on: [push, pull_request]

jobs:
  build:

    permissions: 
      contents: read
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.1.0
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: pnpm
    # - name: get git submodules
    #   run: |
    #     git submodule init
    #     git submodule update
    - name: install packages
      run: |
        pnpm install --frozen-lockfile
    - name: test
      run: |
        pnpm test
    - name: build
      run: |
        pnpm build
    # dev server の配信設定（publicPath・historyApiFallback・HtmlWebpackPlugin）を確認する
    - name: run
      run: |
        pnpm dev &
        html=$(curl -sf --retry 30 --retry-connrefused --retry-delay 2 http://localhost:8020/codeLib2/src/sample.html)
        bundle=$(grep -o 'bundle\.[0-9a-f]*\.js' <<< "$html")
        curl -sf -o /dev/null "http://localhost:8020/codeLib2/$bundle"

