name: lint

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '20'
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Please tell me who you are.
      run: |
        git config --global user.email "15198247+buyoh@users.noreply.github.com"
        git config --global user.name "buyoh(workflow)"
    # - name: get git submodules
    #   run: |
    #     git submodule init
    #     git submodule update
    - name: install packages
      run: |
        yarn
    - name: lint javascript
      run: |
        yarn lint-fix
    - name: commit phase
      run: |
        if [ `git diff | wc -l` -ne 0 ] ; then
        echo detect diff
        git add .
        git commit -m 'lint-fix by Github Actions'
        fi
    - name: push
      uses: ad-m/github-push-action@v0.8.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
